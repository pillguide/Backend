name: PR CI (no deploy)
on:
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: '${{ secrets.PAT }}'

      - name: Checkout manifest main
        uses: actions/checkout@v4
        with:
          repository: pillguide/manifest
          ref: main
          token: '${{ secrets.PAT }}'
          path: manifest

      - name: Validate deployment configuration
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 scripts/validate_deployment.py --environment dev
          python3 scripts/validate_deployment.py --environment production

      - name: Test and Docker build (no push)
        run: docker build -t temp:test -f Dockerfile .
