name: Backend GitOps CI

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-gitops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-update:
    if: github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
      IMAGE_NAME: wien0128/pillguide-be
    steps:
      - name: Check registry and GitOps credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          MANIFEST_TOKEN: ${{ secrets.PAT }}
        run: |
          for key in DOCKERHUB_USERNAME DOCKERHUB_PASSWORD MANIFEST_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::Required Actions secret is unavailable: $key"
              exit 1
            fi
          done

      - name: Checkout backend and configuration
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}
          persist-credentials: false

      - name: Checkout manifest main
        uses: actions/checkout@v4
        with:
          repository: pillguide/manifest
          ref: main
          token: ${{ secrets.PAT }}
          path: manifest
          fetch-depth: 0

      - name: Validate deployment configuration
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 scripts/validate_deployment.py --environment "$DEPLOY_ENV" --image-name "$IMAGE_NAME"

      - name: Set up QEMU for ARM64 runtime
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Test, build and push ARM64 image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Update only the selected environment image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: python3 scripts/update_gitops_image.py

      - name: Commit and push to manifest main
        working-directory: manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEPLOY_ENV/deployment.yaml"
          if git diff --cached --quiet; then
            echo 'Manifest already references this image.'
            exit 0
          fi
          git commit -m "chore($DEPLOY_ENV): backend $GITHUB_SHA"
          # Preserve concurrent updates from the other environment.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo '::error::Could not update manifest/main after three attempts.'
          exit 1
