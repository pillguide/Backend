name: CI main

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/pillguide-be
  DEPLOYMENT_FILE_PATH: manifest/pillguide/deployment.yaml

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: '${{ secrets.PAT }}'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test --info --stacktrace --no-daemon

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t ${{ env.DOCKER_IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push to Docker Hub
        run: docker push ${{ env.DOCKER_IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Checkout manifest repository
        uses: actions/checkout@v4
        with:
          repository: 'pillguide/manifest'
          token: ${{ secrets.PAT }}
          path: 'manifest'

      - name: Update deployment.yml
        run: |
          sed -i "s|image: ${{ env.DOCKER_IMAGE_NAME }}:.*|image: ${{ env.DOCKER_IMAGE_NAME }}:${{ env.IMAGE_TAG }}|g" ${{ env.DEPLOYMENT_FILE_PATH }}
          
          # 변경사항 확인
          echo "Updated deployment.yml: "
          cat ${{ env.DEPLOYMENT_FILE_PATH }} | grep "image: "

      - name: Commit and push manifest changes
        run: |
          cd manifest
          git config --local user.email "taque88@naver.com"
          git config --local user.name "wien0128"
          
          if [[ -n $(git status -s) ]]; then
            git add pillguide/deployment.yaml
            git commit -m "chore: update backend image to ${{ env.IMAGE_TAG }}"
            git push origin main
          else
            echo "No changes to commit. Image tag might be the same."
          fi