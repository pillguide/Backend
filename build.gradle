plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'site.pillguide'
version = '0.0.1-SNAPSHOT'
description = 'Backend for capstone project'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

apply from: 'gradle/spring.gradle'
apply from: 'gradle/database.gradle'
apply from: 'gradle/docs.gradle'
apply from: 'gradle/test.gradle'
apply from: 'gradle/util.gradle'
apply from: 'gradle/security.gradle'


tasks.register('copyConfig', Copy) {
    from 'config/src/main/resources'
    into 'src/main/resources'
    include 'application*.yml'
}

processResources.dependsOn copyConfig

clean {
    delete fileTree('src/main/resources') {
        include 'application.yml'
        include 'application-production.yml'
    }
}
