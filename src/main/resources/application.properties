# The servlet parser and the AI share the 10 MiB file / 11 MiB request limits.
# Keep accepted uploads in memory rather than writing user photos to a temp directory.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.servlet.multipart.file-size-threshold=11MB
spring.servlet.multipart.resolve-lazily=true
