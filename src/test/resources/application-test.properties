# Only used by tests; never contacts the deployed database or OAuth providers.
spring.datasource.url=jdbc:h2:mem:pillguide-test;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.properties.hibernate.show_sql=false
spring.security.oauth2.client.registration.google.client-id=test-google
spring.security.oauth2.client.registration.google.client-secret=test-google
spring.security.oauth2.client.registration.naver.client-id=test-naver
spring.security.oauth2.client.registration.naver.client-secret=test-naver
spring.security.oauth2.client.registration.kakao.client-id=test-kakao
spring.security.oauth2.client.registration.kakao.client-secret=test-kakao
jwt.secretKey=test-only-jwt-key-not-for-production-0123456789
drug.easy.service-key=test-only
drug.prmsn.service-key=test-only
cloud.aws.s3.bucket=test-only
